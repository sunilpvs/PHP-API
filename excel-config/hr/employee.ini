[sheet]
sheet-name = MasterList

[database]
table-name = tbl_employee

[module]
name = employee

[excel-to-database-mapping]
ENTITY = entity_code
EMPLOYEE CODE = old_emp_code
FIRST NAME = f_name
LAST NAME = l_name
EMPLOYEE STATUS = emp_status
MOBILE = mobile
UAN = uan
AADHAR = aadhar
PAN NUMBER = pan_no
ESI NUMBER = esi_no
BANK NAME = bank_name
BANK ACCOUNT NUMBER = bank_account_no
IFSC CODE = ifsc_code
M365 = m365
EMAIL = email
EMPLOYEE TYPE = emp_type
LOCATION = city
DEPARTMENT = department
DESIGNATION = designation
DOJ = doj
DOB = dob

[date-columns]
DOB = dob
DOJ = doj


[template]
file = employee-template.xlsx

[template-columns]
0 = ENTITY
1 = EMPLOYEE CODE
2 = FIRST NAME
3 = LAST NAME
4 = EMPLOYEE STATUS
5 = MOBILE
6 = UAN
7 = AADHAR
8 = PAN NUMBER
9 = ESI NUMBER
10 = BANK NAME
11 = BANK ACCOUNT NUMBER
12 = IFSC CODE
13 = M365
14 = EMAIL
15 = EMPLOYEE TYPE
16 = LOCATION
17 = DEPARTMENT
18 = DESIGNATION
19 = DOJ
20 = DOB

[column-query-mapping]
ENTITY = "SELECT entity_code FROM tbl_entity"
EMPLOYEE TYPE = "SELECT 'Regular' AS emp_type UNION ALL SELECT 'Non-Regular' AS emp_type"
M365 = "SELECT 'YES' AS m365 UNION ALL SELECT 'NO' AS m365"
EMPLOYEE STATUS = "SELECT status FROM tbl_status WHERE module = 'GEN'"
LOCATION = "SELECT city FROM tbl_city"
DEPARTMENT = "SELECT name FROM tbl_department"
DESIGNATION = "SELECT name FROM tbl_designation"


