[sheet]
sheet-name = Salaries

[database]
table-name = tbl_salary

[module]
name = increment

[excel-to-database-mapping]
OLD EMPLOYEE CODE = old_employee_code
NEW EMPLOYEE CODE = new_employee_code
CURRENT GROSS = gross
NEW INCREMENT = increment
CURRENT EFFECTIVE FROM = current_effective_from
CURRENT EFFECTIVE TO = current_effective_to
NEW EFFECTIVE FROM = new_effective_from


[date-columns]
NEW EFFECTIVE FROM = new_effective_from
CURRENT EFFECTIVE FROM = current_effective_from
CURRENT EFFECTIVE TO = current_effective_to

[template]
file = increment-template.xlsx

[template-columns]
0 = OLD EMPLOYEE CODE
1 = NEW EMPLOYEE CODE
2 = EMPLOYEE NAME
3 = CURRENT GROSS
4 = NEW INCREMENT
5 = CURRENT EFFECTIVE FROM
6 = CURRENT EFFECTIVE TO
7 = NEW EFFECTIVE FROM


[column-source]
EMPLOYEE CODE = prefill
EMPLOYEE NAME = prefill
CURRENT GROSS = prefill
CURRENT EFFECTIVE FROM = prefill
NEW INCREMENT = zero
NEW EFFECTIVE FROM = blank
CURRENT EFFECTIVE TO = prefill

[prefill-query]
query = "SELECT
            emp.old_emp_code AS `OLD EMPLOYEE CODE`,
            emp.new_emp_code AS `NEW EMPLOYEE CODE`,
            CONCAT(emp.old_emp_code, ' - ', con.f_name, ' ', con.l_name) AS `EMPLOYEE NAME`,
            sal.gross AS `CURRENT GROSS`,
            sal.effective_from AS `CURRENT EFFECTIVE FROM`,
            sal.effective_to AS `CURRENT EFFECTIVE TO`
        FROM tbl_employee emp
        JOIN tbl_contact con
            ON con.id = emp.contact_id
        JOIN tbl_salary sal
            ON sal.employee_id = emp.id
        WHERE sal.status = 1 AND emp.old_emp_code IS NOT NULL AND emp.new_emp_code IS NOT NULL 
        AND emp.emp_status = 1;"