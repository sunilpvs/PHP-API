[sheet]
sheet-name = Salaries

[database]
table-name = tbl_salary

[module]
name = increment

[excel-to-database-mapping]
EMPLOYEE = employee
GROSS = gross
INCREMENT = increment
LAST EFFECTIVE FROM = last_effective_from
INCREMENT EFFECTIVE FROM = effective_from


[date-columns]
INCREMENT EFFECTIVE FROM = effective_from
LAST EFFECTIVE FROM = last_effective_from


[template]
file = increment-template.xlsx

[template-columns]
0 = EMPLOYEE
1 = GROSS
2 = INCREMENT
3 = LAST EFFECTIVE FROM
4 = INCREMENT EFFECTIVE FROM

[column-source]
EMPLOYEE = prefill
GROSS = prefill
LAST EFFECTIVE FROM = prefill
INCREMENT = zero
INCREMENT EFFECTIVE FROM = blank

[prefill-query]
query = "SELECT
            CONCAT(emp.old_emp_code, ' - ', con.f_name, ' ', con.l_name) AS EMPLOYEE,
            (sal.gross + COALESCE(sal.increment, 0)) AS GROSS,
            sal.effective_from AS `LAST EFFECTIVE FROM`
        FROM tbl_employee emp
        JOIN tbl_contact con
            ON con.id = emp.contact_id
        JOIN tbl_salary sal
            ON sal.employee_id = emp.id
        JOIN (
            SELECT
                employee_id,
                MAX(effective_from) AS max_effective_from
            FROM tbl_salary
            GROUP BY employee_id
        ) latest
            ON latest.employee_id = sal.employee_id
            AND latest.max_effective_from = sal.effective_from;"