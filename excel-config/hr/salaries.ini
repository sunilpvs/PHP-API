[sheet]
sheet-name = Salaries

[database]
table-name = tbl_salary

[module]
name = hr

[excel-to-database-mapping]
EMPLOYEE CODE = old_emp_code
CURRENT GROSS = gross
EFFECTIVE FROM = effective_from
EFFECTIVE TO = effective_to


[other-db-columns]
effective_to


[date-columns]
EFFECTIVE FROM = effective_from
EFFECTIVE TO = effective_to


[template]
file = salary-template.xlsx

[template-columns]
0 = EMPLOYEE CODE
1 = EMPLOYEE NAME
2 = CURRENT GROSS
3 = EFFECTIVE FROM
4 = EFFECTIVE TO

[column-query-mapping]
EMPLOYEE CODE = "SELECT emp.old_emp_code AS employee_code FROM tbl_employee emp 
                    WHERE emp.old_emp_code IS NOT NULL AND emp.emp_status = 1 
                    ORDER BY emp.id"
EMPLOYEE NAME = "SELECT concat(con.f_name,' ', con.l_name) AS employee_name 
                    FROM tbl_employee emp  
                    JOIN tbl_contact con ON con.id = emp.contact_id 
                    WHERE emp.old_emp_code IS NOT NULL AND 
                    emp.emp_status = 1 ORDER BY emp.id;"



