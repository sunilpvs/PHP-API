[sheet]
sheet-name = Salaries

[database]
table-name = tbl_salary

[module]
name = salary

[excel-to-database-mapping]
EMPLOYEE CODE = old_emp_code
GROSS = gross
INCREMENT = increment
EFFECTIVE FROM = effective_from


[other-db-columns]
effective_to


[date-columns]
EFFECTIVE FROM = effective_from


[template]
file = salary-template.xlsx

[template-columns]
0 = EMPLOYEE CODE
1 = GROSS
2 = INCREMENT
3 = EFFECTIVE FROM

[column-query-mapping]
EMPLOYEE CODE = "SELECT concat(emp.old_emp_code, ' - ', con.f_name,' ', con.l_name) AS employee_name FROM tbl_employee emp JOIN tbl_contact con ON con.id = emp.contact_id;"
ENTITY = "SELECT entity_code FROM tbl_entity"

