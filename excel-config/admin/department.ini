[sheet]
sheet-name = Department

[database]
table-name = tbl_department

[module]
name = admin_department

[excel-to-database-mapping]
; column-count = 3
Department = name
Department Code = code
Status = status


[template]
file = department-template.xlsx

[template-columns]
0 = Department
1 = Department Code
2 = Status

[column-query-mapping]
Status = "SELECT status FROM tbl_status WHERE module = 'GEN'"
